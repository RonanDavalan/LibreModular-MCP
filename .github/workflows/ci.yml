name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
          rustup default 1.97
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Generated bridges are current
        run: python3 scripts/build_bridges.py --check
      - name: Bridge tests
        run: python3 -m unittest discover -s tests/bridges
